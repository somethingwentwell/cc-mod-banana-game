# Banana backend on one VM: the gateway players register on (New API) and
# the banana server that keeps the economy and tops up their accounts.
#
#   cp .env.example .env     # fill in ADMIN_TOKEN and, after first login, GATEWAY_TOKEN
#   docker compose up -d
#
# Ports: 3000 New API (players register and use tokens here), 8787 banana
# server (the mod's serverUrl). Put both behind your TLS proxy (Caddy block below).

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: banana-new-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: ${TZ:-UTC}
      # SQLite by default (volume below). For MySQL/Postgres set SQL_DSN, e.g.
      # SQL_DSN: root:123456@tcp(mysql:3306)/new-api
      SESSION_SECRET: ${GATEWAY_SESSION_SECRET:-change-me-session-secret}
    volumes:
      - new-api-data:/data
      - new-api-logs:/app/logs

  banana:
    build: .
    container_name: banana-server
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      DATA_DIR: /data
      # Admin calls to the banana server (PUT /content, /codes, /stock, /claims, /stats).
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      # The gateway the banana server tops up: reachable on the compose network.
      GATEWAY_KIND: ${GATEWAY_KIND:-newapi}            # newapi | oneapi
      GATEWAY_URL: ${GATEWAY_URL:-http://new-api:3000}
      # An admin user's system access token from the gateway (Settings → Personal → System Access Token).
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      # Gateway quota units per $1 (New API / One API default: 500000).
      GATEWAY_QUOTA_PER_USD: ${GATEWAY_QUOTA_PER_USD:-500000}
    volumes:
      - banana-data:/data
    depends_on:
      - new-api

  # Optional TLS in front of both. Point DNS at the VM, set DOMAIN in .env, uncomment.
  # caddy:
  #   image: caddy:2
  #   restart: unless-stopped
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #   environment:
  #     DOMAIN: ${DOMAIN}

volumes:
  new-api-data:
  new-api-logs:
  banana-data:
  # caddy-data:
